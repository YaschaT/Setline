<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#060908" />
    <title>Yascha Training</title>
    <meta name="description" content="Persoonlijk trainings-, voedings- en progressiedashboard." />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Yascha" />
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body class="antialiased">
    <!-- Paints immediately, before any JavaScript is parsed, so the screen is
         never blank while the bundle loads. React replaces it on mount. -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #060908;
      }
      #splash svg { width: 44px; height: 44px; opacity: 0.9; }
      #splash i {
        position: absolute;
        bottom: 22%;
        width: 92px;
        height: 2px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.1);
        overflow: hidden;
      }
      #splash i::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 2px;
        background: #c8ff66;
        animation: splash 1.1s ease-in-out infinite;
      }
      @keyframes splash {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(260%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash i::after { animation: none; width: 100%; opacity: 0.5; }
      }
    </style>
    <div id="splash" aria-label="Laden" role="status">
      <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <path d="M32 31V51" stroke="#72EFD0" stroke-width="9" stroke-linecap="round"></path>
        <path d="M14 14C18 24 24 30 32 35C40 30 46 24 50 14" stroke="#C8FF66" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      <i></i>
    </div>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
